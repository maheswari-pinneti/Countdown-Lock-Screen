<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" stroke="url(#glowGrad)" stroke-width="8" opacity="0.4" />
  
  <!-- Outer Clock Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#glowGrad)" stroke-width="14" stroke-dasharray="16 12" opacity="0.85" />
  
  <!-- Countdown Sweep Arc -->
  <circle cx="256" cy="256" r="140" stroke="#00f0ff" stroke-width="18" stroke-linecap="round" stroke-dasharray="660" stroke-dashoffset="180" />
  
  <!-- Target Crosshair Lines -->
  <line x1="256" y1="90" x2="256" y2="130" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="382" x2="256" y2="422" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />
  <line x1="90" y1="256" x2="130" y2="256" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />
  <line x1="382" y1="256" x2="422" y2="256" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Center Core -->
  <circle cx="256" cy="256" r="48" fill="url(#glowGrad)" />
  <circle cx="256" cy="256" r="24" fill="#070b14" />
  <circle cx="256" cy="256" r="10" fill="#00f0ff" />
</svg>